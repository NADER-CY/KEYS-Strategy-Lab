name: Deploy KEYS to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keys-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify SSH deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.KEYS_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.KEYS_SERVER_HOST_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ] || [ -z "$HOST_KEY" ]; then
            echo "::error::Configure KEYS_DEPLOY_SSH_KEY and KEYS_SERVER_HOST_KEY in repository Actions secrets."
            exit 1
          fi

      - name: Prepare restricted SSH credentials
        env:
          DEPLOY_KEY: ${{ secrets.KEYS_DEPLOY_SSH_KEY }}
          HOST_KEY: ${{ secrets.KEYS_SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/keys_deploy
          chmod 600 ~/.ssh/keys_deploy
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy from GitHub on KEYS server
        run: |
          ssh -i ~/.ssh/keys_deploy \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            root@206.1.101.229 'flock -w 60 /run/lock/keys-strategy-deploy.lock /usr/local/bin/deploy-keys'

      - name: Verify production HTTP endpoints
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 3 https://hamid.kipgoo.com/api/exchanges > /dev/null
          curl --fail --show-error --silent --retry 5 --retry-delay 3 https://hamid.kipgoo.com/symbol-universe > /dev/null
