name: Deploy KEYS to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keys-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check SSH settings
        env:
          KEY_B64: ${{ secrets.KEYS_DEPLOY_SSH_KEY_B64 }}
          HOST_KEY: ${{ secrets.KEYS_SERVER_HOST_KEY }}
        run: |
          test -n "$KEY_B64"
          test -n "$HOST_KEY"
          install -m 700 -d ~/.ssh
          printf '%s' "$KEY_B64" | tr -d '[:space:]' | base64 --decode > ~/.ssh/keys_deploy
          chmod 600 ~/.ssh/keys_deploy
          ssh-keygen -y -f ~/.ssh/keys_deploy >/dev/null
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Install production source and rebuild with rollback
        run: |
          ssh -i ~/.ssh/keys_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            root@206.1.101.229 'flock -w 90 /run/lock/keys-strategy-deploy.lock bash -se' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/keys-strategy-lab/extracted/*/
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Refusing to overwrite local tracked changes"
            exit 1
          fi
          echo "=== GET PUBLIC GITHUB SOURCE ==="
          TEMP="$(mktemp -d /tmp/keys-source.XXXXXXXX)"
          trap 'rm -rf "$TEMP"' EXIT
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 git clone --quiet https://github.com/NADER-CY/KEYS-Strategy-Lab.git "$TEMP/source"
          git fetch "$TEMP/source" main
          OLD="$(git rev-parse HEAD)"
          NEW="$(git rev-parse FETCH_HEAD)"
          MARKER=".cache/keys-production-commit"
          if [ "$OLD" = "$NEW" ] && [ -f "$MARKER" ] && [ "$(cat "$MARKER")" = "$NEW" ]; then
            echo "Already built current production version"
            exit 0
          fi
          BACKUP="$(mktemp -d /opt/keys-strategy-lab/deploy-backups/gha.XXXXXXXX)"
          cp -a dist "$BACKUP/dist"
          rollback() {
            echo "DEPLOY FAILED; restoring application source and build"
            git reset --hard "$OLD" || true
            rm -rf dist
            cp -a "$BACKUP/dist" dist
            systemctl restart keys-strategy-lab.service || true
            rm -rf "$BACKUP"
          }
          trap rollback ERR
          if [ "$OLD" != "$NEW" ]; then
            git merge --ff-only FETCH_HEAD
          fi
          export PATH="/root/.nvm/versions/node/v22.23.4/bin:$PATH"
          echo "=== BUILD ==="
          npm install --legacy-peer-deps
          node ./node_modules/vite/bin/vite.js build
          echo "=== RESTART KEYS ==="
          systemctl restart keys-strategy-lab.service
          for i in 1 2 3 4 5; do
            if systemctl is-active --quiet keys-strategy-lab.service && curl -fsS --max-time 5 http://127.0.0.1:3001/api/exchanges >/dev/null; then
              mkdir -p .cache
              printf '%s\n' "$NEW" > "$MARKER"
              trap - ERR
              rm -rf "$BACKUP"
              echo "DEPLOY SUCCESS $NEW"
              exit 0
            fi
            sleep 2
          done
          false
          REMOTE

      - name: Verify site
        run: |
          curl -fsS --retry 5 --retry-delay 3 https://hamid.kipgoo.com/api/exchanges > /dev/null
          curl -fsS --retry 5 --retry-delay 3 https://hamid.kipgoo.com/symbol-universe > /dev/null
